#для корректной работы api gateway
spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
          filters:
#            - AuthenticationFilter
            - RewritePath=/auth/(?<path>.*), /$\{path}
        - id: web-client
          uri: lb://web-client
          predicates:
            - Path=/web-client/**
          filters:
            - AuthenticationFilter
            - RewritePath=/web-client/(?<path>.*), /$\{path}
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/user/**
          filters:
            - AuthenticationFilter
            - RewritePath=/user/(?<path>.*), /$\{path}
        - id: list-service
          uri: lb://list-service
          predicates:
            - Path=/list/**
          filters:
            - AuthenticationFilter
            - RewritePath=/list/(?<path>.*), /$\{path}
#            - TokenRelay=
#            - RemoveRequestHeader=Cookie
        - id: openapi
          uri: http://localhost:${server.port}
          predicates:
            - Path=/v3/api-docs/**
          filters:
            - RewritePath=/v3/api-docs/(?<path>.*), /$\{path}/v3/api-docs

springdoc:
  swagger-ui:
    urls:
      - name: user
        url: /v3/api-docs/user
      - name: list
        url: /v3/api-docs/list