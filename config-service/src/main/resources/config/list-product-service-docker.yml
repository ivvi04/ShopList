server:
  port: 0

#url, куда будет происходить регистрация микросервисов и другие важные действия
eureka:
  client:
    serviceUrl:
      defaultZone: http://server-service:8761/eureka/
  instance:
    hostname: list-product-service
    InstanceId: ${spring.application.name}:${random.uuid}
    preferIpAddress: true

springdoc:
  packagesToScan: ru.lakeevda.listservice

spring:
  datasource:
    url: "jdbc:postgresql://shop-list-db:5432/shoplist"
    driverClassName: "org.postgresql.Driver"
    username: postgres
    password: postgres
