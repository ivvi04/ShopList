server:
  port: 8765

#url, куда будет происходить регисрация микросервисов и другие важные действия
eureka:
  client:
    serviceUrl:
      defaultZone: http://server-service:8761/eureka/
  instance:
    hostname: gateway-service
    preferIpAddress: true

#для корректной работы api gateway
spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: auth
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
          filters:
            - RewritePath=/auth/(?<path>.*), /$\{path}
        - id: user
          uri: lb://auth-service
          predicates:
            - Path=/user/**
          filters:
            - AuthenticationFilter
            - RewritePath=/user/(?<path>.*), /$\{path}
        - id: web-client
          uri: lb://web-client
          predicates:
            - Path=/web-client/**
          filters:
            - AuthenticationFilter
            - RewritePath=/web-client/(?<path>.*), /$\{path}
        - id: list-product
          uri: lb://list-product-service
          predicates:
            - Path=/list-product/**
          filters:
            - AuthenticationFilter
            - RewritePath=/list-product/(?<path>.*), /$\{path}
        - id: openapi
          uri: http://localhost:${server.port}
          predicates:
            - Path=/v3/api-docs/**
          filters:
            - RewritePath=/v3/api-docs/(?<path>.*), /$\{path}/v3/api-docs

springdoc:
  swagger-ui:
    urls:
      - name: user
        url: /v3/api-docs/user
      - name: list
        url: /v3/api-docs/list-product
