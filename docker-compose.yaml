version: '3.9'

services:
  shoplistdb:
    image: 'postgres:18.1'
    container_name: 'shop-list-db'
    ports:
      - "5433:5432/tcp"
    volumes:
      - ./postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_DB=shoplist
    networks:
      - my-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 3

  configservice:
    image: config-service
    build: config-service
    container_name: 'config-service'
    ports:
      - 8888:8888
    depends_on:
      shoplistdb:
        condition: service_healthy
    links:
      - shoplistdb
    networks:
      - my-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  serverservice:
    image: server-service
    build: server-service
    container_name: 'server-service'
    ports:
      - 8761:8761
    environment:
      - "SPRING_PROFILES_ACTIVE=docker"
    depends_on:
      shoplistdb:
        condition: service_healthy
      configservice:
        condition: service_healthy
    links:
      - shoplistdb
      - configservice
    networks:
      - my-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  authservice:
    image: auth-service
    build: auth-service
    container_name: 'auth-service'
    environment:
      - "SPRING_PROFILES_ACTIVE=docker"
    depends_on:
      shoplistdb:
        condition: service_healthy
      configservice:
        condition: service_healthy
      serverservice:
        condition: service_healthy
    links:
      - shoplistdb
      - configservice
      - serverservice
    networks:
      - my-net

  listservice:
    image: list-service
    build: list-service
    container_name: 'list-service'
    environment:
      - "SPRING_PROFILES_ACTIVE=docker"
    depends_on:
      shoplistdb:
        condition: service_healthy
      configservice:
        condition: service_healthy
      serverservice:
        condition: service_healthy
    links:
      - shoplistdb
      - configservice
      - serverservice
    networks:
      - my-net

  productservice:
    image: product-service
    build: product-service
    container_name: 'product-service'
    environment:
      - "SPRING_PROFILES_ACTIVE=docker"
    depends_on:
      shoplistdb:
        condition: service_healthy
      configservice:
        condition: service_healthy
      serverservice:
        condition: service_healthy
    links:
      - shoplistdb
      - configservice
      - serverservice
    networks:
      - my-net

  userservice:
    image: user-service
    build: user-service
    container_name: 'user-service'
    environment:
      - "SPRING_PROFILES_ACTIVE=docker"
    depends_on:
      shoplistdb:
        condition: service_healthy
      configservice:
        condition: service_healthy
      serverservice:
        condition: service_healthy
    links:
      - shoplistdb
      - configservice
      - serverservice
    networks:
      - my-net

  gatewayservice:
    image: gateway-service
    build: gateway-service
    container_name: 'gateway-service'
    ports:
      - 8765:8765
    environment:
      - "SPRING_PROFILES_ACTIVE=docker"
    depends_on:
      configservice:
        condition: service_healthy
      serverservice:
        condition: service_healthy
      authservice:
        condition: service_started
      listservice:
        condition: service_started
      productservice:
        condition: service_started
      userservice:
        condition: service_started
    links:
      - configservice
      - serverservice
      - authservice
      - listservice
      - productservice
      - userservice
    networks:
      - my-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  clientreact:
    image: clientreact
    build: clientreact
    container_name: 'clientreact'
    ports:
      - 3000:3000
    depends_on:
      gatewayservice:
        condition: service_healthy
    links:
      - gatewayservice
    networks:
      - my-net
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  my-net:
    driver: bridge
